<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖刻 · 1.1 与 1.2 对比</title><style>

</style></head><body><main><h1>同一个栖刻，两种表达。</h1><p>同一任务、文案、业务代码与品牌 IP。1.1 保留平静纸本风格，1.2 显式选择浅色科技精修；下面展示真实代码截图。</p><nav class="tabs" aria-label="选择对比页面"><button data-screen="today" aria-pressed="true">今天</button><button data-screen="focus" aria-pressed="false">专注</button><button data-screen="history" aria-pressed="false">记录</button><button data-screen="marketing.desktop" aria-pressed="false">桌面宣传页</button><button data-screen="marketing.mobile" aria-pressed="false">手机宣传页</button></nav><section class="versions" aria-label="真实界面对比"><figure><h2>1.1.0 · calm</h2><img id="before" src="v1.1.0/screenshots/today.jpg" width="390" height="844" alt="1.1.0 今天页面真实截图"><figcaption>冻结原版，保留原始通过与失败证据</figcaption></figure><figure><h2>1.2.0 · tech-refined</h2><img id="after" src="v1.2.0/screenshots/today.jpg" width="390" height="844" alt="1.2.0 今天页面真实截图"><figcaption>材质与状态反馈精修，业务行为保持</figcaption></figure></section><div class="links"><a href="v1.1.0/index.html">体验 1.1</a><a href="v1.2.0/index.html">体验 1.2</a><a href="v1.2.0/landing.html">打开新版宣传页</a><a href="../../evidence/comparison.json">查看可比性报告</a></div><section class="proof"><h2>看见差异，也保留边界。</h2><p>更换 tone 是本次对照变量，截图不同不等于新版本普遍更好。文件契约检查用于核对相同产品、状态、业务与素材、实际图片尺寸；它不会评出视觉优劣。</p><p class="source">以下为 AI 方向稿，仅作设计参考，和上面的真实界面截图分别记录。初始专注统计为示例数据。</p><div class="directions"><figure><img src="../../evidence/v1.1.0/generated-direction.png" alt="1.1 三屏生成方向稿，仅作参考" loading="lazy"><figcaption>1.1 image 方向稿，生成文案和统计不作为事实</figcaption></figure><figure><img src="../../evidence/v1.2.0/generated-direction.png" alt="1.2 三屏生成方向稿，仅作参考" loading="lazy"><figcaption>1.2 image 方向稿，品牌一致性参考</figcaption></figure></div></section></main><script>
const names={today:'今天',focus:'专注',history:'记录','marketing.desktop':'桌面宣传页','marketing.mobile':'手机宣传页'};
for(const button of document.querySelectorAll('[data-screen]'))button.addEventListener('click',()=>{const screen=button.dataset.screen;for(const b of document.querySelectorAll('[data-screen]'))b.setAttribute('aria-pressed',String(b===button));for(const [id,version]of [['before','v1.1.0'],['after','v1.2.0']]){const img=document.getElementById(id);img.src=version+'/screenshots/'+screen+'.jpg';img.alt=version+' '+names[screen]+'真实截图';if(screen==='marketing.desktop'){img.width=1440;img.height=1000}else{img.width=390;img.height=844}}});
</script></body></html>
