<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栖刻 · 三屏交互展示</title><link rel="stylesheet" href="tokens.css"><style>*{box-sizing:border-box}body{margin:0;background:#E7ECE3;color:var(--forest);font-family:var(--sans);padding:35px 30px 40px}header{max-width:1320px;margin:0 auto 28px;display:flex;align-items:baseline;justify-content:space-between;gap:20px}h1{font-size:28px;margin:0;font-family:var(--serif)}header p{font-size:12px;margin:0;color:var(--muted)}a{color:inherit;text-underline-offset:4px}.screens{display:grid;grid-template-columns:repeat(3,minmax(0,390px));gap:28px;justify-content:center;max-width:1320px;margin:auto}figure{margin:0;min-width:0}iframe{width:100%;height:844px;border:0;border-radius:28px;background:var(--paper);display:block;box-shadow:0 12px 30px #214D3B0E}figcaption{display:flex;justify-content:space-between;padding:15px 5px 0;font-size:12px}figcaption span{color:var(--muted)}@media(max-width:850px){.screens{grid-template-columns:minmax(0,390px)}header{align-items:flex-start;flex-direction:column}body{padding:24px 16px}}</style></head><body><header><h1>栖刻 · 让专注，自然而然。</h1><p>真实 HTML 交互界面 · <a href="landing.html">宣传页 ↗</a> · <a href="index.html">打开 APP ↗</a></p></header><main class="screens"><figure><iframe src="index.html#today" title="今天页面"></iframe><figcaption>今天<span>选择一件在意的事</span></figcaption></figure><figure><iframe src="index.html#focus" title="专注页面"></iframe><figcaption>专注<span>把注意力放回当下</span></figcaption></figure><figure><iframe src="index.html#history" title="记录页面"></iframe><figcaption>记录<span>看见每一段投入</span></figcaption></figure></main></body></html>
