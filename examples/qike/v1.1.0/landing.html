<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F6EF">
  <meta name="description" content="栖刻 QIKE，让任务、专注计时与记录各得其所。一次只做一件在意的事。">
  <title>栖刻 QIKE · 把时间，留给在意的事</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header page-width">
    <a class="brand" href="landing.html" aria-label="栖刻 QIKE 首页">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 4c1 9-3 15-9 15-4 0-7-3-7-7C4 6 10 3 20 4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="m5 20 10-10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>栖刻<span class="brand-roman">QIKE</span></span>
    </a>
    <nav aria-label="主导航"><a class="nav-screens" href="#screens">产品界面</a><a class="nav-cta" href="index.html">体验栖刻<span aria-hidden="true"> ↗</span></a></nav>
  </header>
  <main id="main">
    <section class="hero page-width" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">把时间，<br>留给在意的事。</h1>
        <p class="hero-description">放下一点纷扰，从眼前这一件开始。<br>让栖刻陪你，安静地做完它。</p>
        <div class="hero-actions"><a class="button button-primary" href="index.html">体验栖刻<span aria-hidden="true"> ↗</span></a><a class="button button-secondary" href="#screens">看看界面<span aria-hidden="true"> ↓</span></a></div>
      </div>
      <div class="hero-visual">
        <div class="visual-field" aria-hidden="true"></div>
        <img class="hero-screen" src="assets/screen-focus.jpg" width="390" height="844" alt="栖刻专注准备界面，计时显示25:00" fetchpriority="high">
        <img class="hero-sprout" src="assets/sprout.png" width="480" height="480" alt="栖刻的小芽伙伴，奶白陶瓷盆中长着两片绿叶">
      </div>
    </section>
    <section id="screens" class="screens-section" aria-labelledby="screens-title">
      <div class="page-width">
        <div class="section-intro"><h2 id="screens-title">少一点切换，<br>多一点投入。</h2><p>从记下任务，到留下一次专注。<br>你需要的，就在这三个页面里。</p></div>
        <div class="screen-gallery">
          <figure class="product-figure"><div class="screen-stage stage-today"><img src="assets/screen-today.jpg" width="390" height="844" loading="lazy" alt="今天页面，可新增任务并标记完成"></div><figcaption><h3>把今天，理清楚</h3><p>写下眼前要做的事，完成一件，轻轻划去一件。</p></figcaption></figure>
          <figure class="product-figure figure-focus"><div class="screen-stage stage-focus"><img src="assets/screen-focus.jpg" width="390" height="844" loading="lazy" alt="专注页面，显示任务，开始、暂停、继续或结束计时"></div><figcaption><h3>只留一件，在眼前</h3><p>留出一段完整的时间。开始以后，也可以暂停再继续。</p></figcaption></figure>
          <figure class="product-figure"><div class="screen-stage stage-history"><img src="assets/screen-history.jpg" width="390" height="844" loading="lazy" alt="记录页面，查看已完成的专注记录与实际时长"></div><figcaption><h3>让投入，有迹可循</h3><p>回看每一次专注，看到自己认真度过的时间。</p></figcaption></figure>
        </div>
      </div>
    </section>
    <section class="closing page-width" aria-labelledby="closing-title">
      <div class="closing-thought"><h2 id="closing-title">不必每一刻，<br>都很有成就。</h2><p>有时，专注只是把手机放远一点，<br class="desktop-break">给手里的事情一个完整的开始。</p><p>打开栖刻，记下一件事，选好时长。<br>剩下的时间，交给你自己。</p></div>
      <div class="closing-art"><img src="assets/sprout.png" width="480" height="480" loading="lazy" alt="" aria-hidden="true"><p>慢慢来，也是在向前。</p></div>
    </section>
  </main>
  <footer class="site-footer page-width"><p class="footer-brand">栖刻 <span>QIKE</span></p><p>栖刻为交互设计示例，数据保存在当前浏览器</p><a href="index.html">体验栖刻 <span aria-hidden="true">↗</span></a></footer>
</body>
</html>
