<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="APP UI Studio 本地截图评审，支持候选选择、位置批注与反馈交接。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='9' fill='%232854d8'/%3E%3Cpath d='M11 9h14v18H11z' fill='white'/%3E%3C/svg%3E"><title>设计候选对比</title>
<style>__STUDIO_CSS__</style>
<body class="studio-board">
<header class="brandbar"><div class="brand"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#1d2535"/><rect x="11" y="6" width="14" height="24" rx="3" fill="white"/><path d="M14 11h8M14 15h8M14 22l3-3 2 2 3-4" stroke="#2854d8" stroke-width="1.5" stroke-linecap="round"/></svg><span>APP UI Studio</span><span class="brandbar-label">评审工作台</span></div><span class="meta">本地评审 · 反馈由你掌控</span></header>
<main>
 <noscript><p>评审工作台需要启用 JavaScript 才能选择、批注和导出。原始截图位于随附的 assets 文件夹。</p></noscript>
 <div class="pagehead"><div><h1 id="title"></h1></div><details class="context-box"><summary>查看取证条件</summary><p id="context" class="meta"></p></details></div>
 <div class="tools"><div class="viewport-control"><label for="viewport">视口</label><select id="viewport"></select></div><span class="quiet-caption">选择推荐方案，或打开截图定位批注</span></div>
 <div class="workspace-layout"><div id="grid" class="grid"></div>
 <section class="feedback" aria-labelledby="feedback-title"><div class="feedback-heading"><h2 id="feedback-title">评审与交接</h2><span id="feedback-count" class="meta"></span></div>
 <label id="notes-label" for="notes">选择候选后填写整图意见</label><textarea id="notes" maxlength="8000" placeholder="写下这张截图需要保留或调整的地方…" disabled></textarea><p id="draft-status" role="status"></p>
 <div class="handoff-actions"><button id="download" class="primary" type="button">导出反馈 JSON</button><button id="copy" type="button">复制交接意见</button></div>
 <p id="status" role="status" aria-live="polite">尚未选择候选</p>
 <details class="handoff-details"><summary>查看完整交接文本</summary><label for="summary">包含截图身份与位置</label><textarea id="summary" readonly></textarea></details>
 <p class="meta">反馈不会自动修改项目，也不代表视觉质量认证。</p></section></div>
</main>
<dialog id="detail" aria-labelledby="detail-label"><div class="dialog-header"><div class="dialog-heading"><h2 id="detail-label"></h2><details class="source-details"><summary>截图身份</summary><p id="source-id"></p></details></div><button id="close" type="button">关闭预览</button></div>
 <div class="dialog-grid"><div class="image-side"><div class="image-toolbar"><span id="preview-mode">适合窗口</span><a class="mobile-jump" href="#annotation-text">填写批注 ↓</a><button id="zoom" type="button" aria-pressed="false">原始尺寸</button></div><div id="image-pane" class="full"><div id="image-stage" class="stage"><img id="full-image" alt=""><div id="pins"></div><span id="cursor" aria-hidden="true"></span></div></div><p id="image-status" class="meta" role="status"></p></div>
 <section class="inspector" aria-labelledby="annotation-title"><h3 id="annotation-title">位置批注</h3><p class="meta">点选截图或输入百分比，位置始终跟随原图。</p><form id="annotation-form"><div class="coordinates"><label for="x">横向位置 %<input id="x" type="number" min="0" max="100" step="0.1" value="50" required></label><label for="y">纵向位置 %<input id="y" type="number" min="0" max="100" step="0.1" value="50" required></label></div><label for="annotation-text">此处需要保留或调整什么</label><textarea id="annotation-text" maxlength="8000" required></textarea><button id="save-annotation" class="primary" type="submit">保存此处批注</button></form><p id="annotation-status" role="status" aria-live="polite"></p><p id="annotation-empty">此截图还没有位置批注。</p><ol id="annotation-list" aria-label="此截图的位置批注"></ol></section></div>
</dialog><script id="board-data" type="application/json">__DATA__</script><script>__SCRIPT__</script></body></html>
