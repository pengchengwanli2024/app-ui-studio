<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设计候选对比</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18202b;background:#f3f4f6;line-height:1.5;--accent:#163f6b;--muted:#465467;--line:#cbd0d8}
*{box-sizing:border-box}body{margin:0}main{padding:24px;max-width:1800px;margin:auto}h1{font-size:26px;margin:0 0 8px}h2{font-size:18px;margin:0}h3{font-size:16px;margin:0}p{margin:8px 0}header{margin-bottom:20px}.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
button,select,textarea,input{font:inherit;border:1px solid #697586;border-radius:6px;padding:9px 12px;color:inherit;background:white}button,select,input{min-height:44px}button{cursor:pointer}button[aria-pressed=true],.primary{background:var(--accent);color:white}.secondary{background:#f5f7fa}button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #216bc4;outline-offset:3px}button:disabled,textarea:disabled{background:#edf0f4;color:#465467;cursor:default}
.tools,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tools{margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}.card.chosen{border:2px solid var(--accent);padding:15px}.preview{display:block;width:100%;padding:0;border:1px solid var(--line);background:#e9edf2;margin:12px 0;overflow:hidden}.preview img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain}.feedback{margin-top:24px;display:grid;gap:8px;max-width:920px}textarea{width:100%;min-height:90px;resize:vertical}#summary{min-height:180px;font-size:14px}#status{min-height:24px}#draft-status{margin:0}
dialog{width:min(1360px,calc(100vw - 32px));max-width:none;max-height:94vh;padding:20px;border:1px solid #697586;border-radius:10px;overflow:auto}dialog::backdrop{background:#18202b99}.dialog-header{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:16px}.dialog-header h2{font-size:18px}#close{flex:none;white-space:nowrap}.dialog-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}.full{overflow:auto;max-height:72vh;background:#e9edf2;border:1px solid var(--line)}.stage{position:relative;width:max-content;max-width:none}.stage img{display:block;max-width:none;cursor:crosshair}#pins{position:absolute;inset:0;pointer-events:none}.pin,#cursor{position:absolute;transform:translate(-50%,-50%);min-width:28px;height:28px;padding:2px 5px;border:2px solid white;border-radius:50%;background:var(--accent);color:white;text-align:center;font-size:13px;box-shadow:0 1px 4px #18202b55;pointer-events:none}#cursor{min-width:18px;height:18px;padding:0;background:#ad3f10;outline:1px solid white;outline-offset:2px}.inspector{min-width:0}form{display:grid;gap:8px}.coordinates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.coordinates label{display:grid;gap:4px}.coordinates input{width:100%}#annotation-list{padding-left:24px;max-height:30vh;overflow:auto}#annotation-list li{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}#annotation-list p{white-space:pre-wrap;overflow-wrap:anywhere}#annotation-status{min-height:24px;font-size:13px;color:var(--muted)}#annotation-empty{font-size:14px;color:var(--muted)}
@media(max-width:800px){.dialog-grid{grid-template-columns:1fr;gap:16px}.full{max-height:42vh}.dialog-header{position:static}dialog{padding:16px}#annotation-list{max-height:none}}
@media(max-width:520px){main{padding:16px}h1{font-size:23px}.grid{gap:16px}.tools{align-items:start}.dialog-header{gap:8px}.dialog-header h2{font-size:16px}textarea,input{font-size:16px}}
</style>
<main>
  <header><h1 id="title"></h1><p id="context" class="meta"></p><p class="meta">查看截图、留下意见，再交给开发者回改。选择和批注都不会自动修改项目。</p></header>
  <div class="tools"><label for="viewport">对比视口</label><select id="viewport"></select><span class="meta">点击截图查看原尺寸与定位批注</span></div>
  <div id="grid" class="grid"></div>
  <section class="feedback" aria-labelledby="feedback-title">
    <div class="actions"><h2 id="feedback-title">选择与交接</h2><span id="feedback-count" class="meta"></span></div>
    <label id="notes-label" for="notes">选择候选后填写整图意见</label><textarea id="notes" maxlength="8000" disabled></textarea>
    <p id="draft-status" class="meta" role="status"></p>
    <label for="summary">交接意见（包含截图身份与位置）</label><textarea id="summary" readonly></textarea>
    <div class="actions"><button id="copy" type="button" class="primary">复制意见</button><button id="download" type="button">导出反馈 JSON</button></div>
    <p id="status" role="status" aria-live="polite">尚未选择候选</p>
  </section>
</main>
<dialog id="detail" aria-labelledby="detail-label">
  <div class="dialog-header"><div><h2 id="detail-label"></h2><p id="source-id" class="meta"></p></div><button id="close" type="button">关闭预览</button></div>
  <div class="dialog-grid">
    <div class="full"><div class="stage"><img id="full-image" alt=""><div id="pins"></div><span id="cursor" aria-hidden="true"></span></div></div>
    <section class="inspector" aria-labelledby="annotation-title">
      <h3 id="annotation-title">位置批注</h3><p class="meta">点击原图，或输入位置百分比。批注始终跟随这张截图。</p>
      <form id="annotation-form">
        <div class="coordinates"><label for="x">横向位置 %<input id="x" type="number" min="0" max="100" step="0.1" value="50" required></label><label for="y">纵向位置 %<input id="y" type="number" min="0" max="100" step="0.1" value="50" required></label></div>
        <label for="annotation-text">此处需要保留或调整什么</label><textarea id="annotation-text" maxlength="8000" required></textarea>
        <button class="primary" type="submit">保存此处批注</button>
      </form>
      <p id="annotation-status" role="status" aria-live="polite"></p>
      <p id="annotation-empty">此截图还没有位置批注。</p><ol id="annotation-list" aria-label="此截图的位置批注"></ol>
    </section>
  </div>
</dialog>
<script id="board-data" type="application/json">__DATA__</script>
<script>__SCRIPT__</script>
</html>
